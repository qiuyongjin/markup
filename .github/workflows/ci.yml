name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # 不写版本号的话，这个 action 找不到 pnpm（package.json 里也没有 packageManager）
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 静态检查
      - run: pnpm lint

      # 单元测试（node 侧）
      - run: pnpm test

      # 类型检查 + 生产构建
      - run: pnpm build

      # 浏览器端到端测试的打包（需要真实浏览器才能跑断言）
      - run: pnpm test:browser
